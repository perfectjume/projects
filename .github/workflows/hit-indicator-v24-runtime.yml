name: Hit Indicator v24 universal stasis grayscale runtime test

on:
  push:
    branches:
      - hit-indicator-v24-universal-stasis-grayscale
    paths:
      - '.github/workflows/hit-indicator-v24-runtime.yml'
      - 'runtime-test/**'
  workflow_dispatch:

jobs:
  literal-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool imagemagick libgl1-mesa-dri mesa-utils

      - name: Build and run v24 matrix
        run: bash runtime-test/run-v24-ci.sh

      - name: Upload v24 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hit-indicator-v24-universal-stasis-grayscale-evidence
          if-no-files-found: warn
          path: |
            /tmp/hit-indicator-v24-universal-stasis-grayscale-evidence.zip
            /tmp/hit_indicator-1.21.1-neoforge-v24.jar
            /tmp/stasis-desaturation-v24.javap
            /tmp/stasis-events-v24.javap
            /tmp/levelrenderer-stasis-v24.javap
            client-latest.log
            server-latest.log
            runtime-summary.txt
            filtered-runtime.log
            screenshots/**
