name: Hit Indicator v21 stable time-stop runtime test

on:
  push:
    branches:
      - hit-indicator-v21-stable-time-stop
    paths:
      - '.github/workflows/hit-indicator-v21-runtime.yml'
      - 'runtime-test/**'
  workflow_dispatch:

jobs:
  literal-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool imagemagick libgl1-mesa-dri mesa-utils

      - name: Build and run v21 matrix
        run: bash runtime-test/run-v21-ci.sh

      - name: Upload v21 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hit-indicator-v21-stable-time-stop-evidence
          if-no-files-found: warn
          path: |
            /tmp/hit-indicator-v21-stable-time-stop-evidence.zip
            /tmp/hit_indicator-1.21.1-neoforge-v21.jar
            /tmp/windup-v20.javap
            /tmp/clientlevel-time-stop-v21.javap
            /tmp/levelrenderer-time-stop-v21.javap
            /tmp/frozen-maintenance-v21.javap
            /tmp/frozen-render-clock-v21.javap
            client-latest.log
            server-latest.log
            runtime-summary.txt
            filtered-runtime.log
            screenshots/**
