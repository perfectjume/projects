name: Hit Indicator v22 continuous-resume runtime test

on:
  push:
    branches:
      - hit-indicator-v22-continuous-resume
    paths:
      - '.github/workflows/hit-indicator-v22-runtime.yml'
      - 'runtime-test/**'
  workflow_dispatch:

jobs:
  literal-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool imagemagick libgl1-mesa-dri mesa-utils

      - name: Build and run v22 matrix
        run: bash runtime-test/run-v22-ci.sh

      - name: Upload v22 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hit-indicator-v22-continuous-resume-evidence
          if-no-files-found: warn
          path: |
            /tmp/hit-indicator-v22-continuous-resume-evidence.zip
            /tmp/hit_indicator-1.21.1-neoforge-v22.jar
            /tmp/windup-v20.javap
            /tmp/clientlevel-time-stop-v21.javap
            /tmp/levelrenderer-time-stop-v21.javap
            /tmp/frozen-maintenance-v21.javap
            /tmp/frozen-render-clock-v21.javap
            /tmp/frozen-render-clock-v22.javap
            /tmp/clientlevel-time-stop-v22.javap
            client-latest.log
            server-latest.log
            runtime-summary.txt
            filtered-runtime.log
            screenshots/**
