name: Vanilla 1.21.1 Linux client libraries

on:
  push:
    branches:
      - port7-runtime-bundle
    paths:
      - '.github/workflows/vanilla-1.21.1-linux-libs.yml'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download exact 1.21.1 Linux libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vanilla-libs/libraries
          curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json -o /tmp/manifest.json
          URL="$(jq -r '.versions[] | select(.id=="1.21.1") | .url' /tmp/manifest.json)"
          curl -fsSL "$URL" -o /tmp/1.21.1.json

          {
            jq -r '.libraries[] | .downloads.artifact? | select(.url != null) | [.url,.path,.sha1] | @tsv' /tmp/1.21.1.json
            jq -r '.libraries[] | .downloads.classifiers?["natives-linux"]? | select(.url != null) | [.url,.path,.sha1] | @tsv' /tmp/1.21.1.json
            jq -r '.libraries[] | .downloads.classifiers?["natives-linux-64"]? | select(.url != null) | [.url,.path,.sha1] | @tsv' /tmp/1.21.1.json
          } | sort -u > /tmp/files.tsv

          while IFS=$'\t' read -r url path sha; do
            mkdir -p "/tmp/vanilla-libs/libraries/$(dirname "$path")"
            curl -fsSL --retry 3 "$url" -o "/tmp/vanilla-libs/libraries/$path"
            printf '%s  %s\n' "$sha" "/tmp/vanilla-libs/libraries/$path" | sha1sum -c -
          done < /tmp/files.tsv

          echo "Downloaded $(wc -l < /tmp/files.tsv) files"
          du -sh /tmp/vanilla-libs/libraries
          tar -C /tmp/vanilla-libs -czf /tmp/vanilla-1.21.1-linux-libs.tar.gz libraries
          sha256sum /tmp/vanilla-1.21.1-linux-libs.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-1.21.1-linux-libs
          path: /tmp/vanilla-1.21.1-linux-libs.tar.gz
          compression-level: 0
