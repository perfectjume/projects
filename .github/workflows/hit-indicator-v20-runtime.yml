name: Hit Indicator v20 isolated runtime test

on:
  push:
    branches:
      - hit-indicator-v20-immediate-bettercombat-freeze
    paths:
      - '.github/workflows/hit-indicator-v20-runtime.yml'
      - 'runtime-test/**'
  workflow_dispatch:

jobs:
  literal-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool imagemagick libgl1-mesa-dri mesa-utils

      - name: Build and run v20 matrix
        run: bash runtime-test/run-v20-ci.sh

      - name: Upload v20 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hit-indicator-v20-evidence
          if-no-files-found: warn
          path: |
            /tmp/hit-indicator-v20-evidence.zip
            /tmp/hit_indicator-1.21.1-neoforge-v20.jar
            /tmp/windup-v20.javap
            /tmp/playeranim-freeze-v19.javap
            client-latest.log
            server-latest.log
            runtime-summary.txt
            filtered-runtime.log
            screenshots/**
