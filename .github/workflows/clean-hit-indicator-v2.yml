name: Clean Hit Indicator v2 build and compatibility

on:
  push:
    branches:
      - clean-hit-indicator-v2
    paths:
      - 'clean-hit-indicator/**'
      - '.github/workflows/clean-hit-indicator-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build clean Hit Indicator
        working-directory: clean-hit-indicator
        run: gradle --no-daemon build

      - name: Verify identity and NeoForge range
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find clean-hit-indicator/build/libs -maxdepth 1 -name '*.jar' | head -1)"
          test -f "$JAR"
          unzip -t "$JAR"

          python3 - "$JAR" <<'PY'
          import sys, zipfile
          jar=sys.argv[1]
          with zipfile.ZipFile(jar) as z:
              names=z.namelist()
              joined='\n'.join(names).lower()
              meta=z.read('META-INF/neoforge.mods.toml').decode('utf-8','replace')

              assert 'modId="hit_indicator"' in meta, meta
              assert 'displayName="Hit Indicator"' in meta, meta
              assert 'versionRange="[21.1.248,21.1.252)"' in meta, meta
              assert 'hit_indicator.mixins.json' in names
              assert 'assets/hit_indicator/shaders/core/stasis_desaturate.fsh' in names

              assert 'soulshade' not in joined, joined
              assert 'soulshade' not in meta.lower(), meta
              assert 'misanthropy' not in joined, joined
              assert 'misanthropy' not in meta.lower(), meta
              assert '1.7.1-port' not in meta, meta
              assert not any(n.startswith('com/misanthropy/') for n in names)

              forbidden=[n for n in names if n.endswith('.toml') and n != 'META-INF/neoforge.mods.toml']
              assert not forbidden, forbidden
              print('CLEAN_HIT_INDICATOR_V2_ARTIFACT_PASS')
          PY

          sha256sum "$JAR" | tee hit-indicator-clean-v2-sha256.txt

      - name: Upload exact binary
        uses: actions/upload-artifact@v4
        with:
          name: hit-indicator-clean-v2-binary
          path: |
            clean-hit-indicator/build/libs/*.jar
            hit-indicator-clean-v2-sha256.txt

  runtime:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        neo:
          - '21.1.248'
          - '21.1.251'
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Download exact clean binary
        uses: actions/download-artifact@v4
        with:
          name: hit-indicator-clean-v2-binary
          path: clean-binary

      - name: Prepare NeoForge ${{ matrix.neo }} runtime
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_JAR="$(find clean-binary -name '*.jar' | head -1)"
          test -f "$CLEAN_JAR"

          git clone --depth 1 https://github.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle.git runtime-mdk
          cd runtime-mdk

          sed -i 's/^neo_version=.*/neo_version=${{ matrix.neo }}/' gradle.properties
          sed -i 's/^mod_id=.*/mod_id=hit_indicator_runtime_test/' gradle.properties
          sed -i 's/^mod_name=.*/mod_name=Hit Indicator Runtime Test/' gradle.properties
          sed -i 's/^mod_version=.*/mod_version=1.0.0/' gradle.properties
          sed -i 's/^mod_group_id=.*/mod_group_id=dev.hitindicator.runtime/' gradle.properties

          rm -rf src/main/java/com/example/examplemod
          mkdir -p src/main/java/dev/hitindicator/runtime libs run/mods
          cp ../clean-hit-indicator/runtime-test/CleanRuntimeTestMod.java src/main/java/dev/hitindicator/runtime/
          cp ../clean-hit-indicator/runtime-test/CleanRuntimeTestClient.java src/main/java/dev/hitindicator/runtime/
          cp "../$CLEAN_JAR" libs/hit-indicator.jar
          cp "../$CLEAN_JAR" run/mods/hit-indicator.jar

          sed -i '/dependencies {/a\    compileOnly files("libs/hit-indicator.jar")' build.gradle
          sed -i "/^[[:space:]]*client()$/a\            programArguments.addAll '--quickPlaySingleplayer', 'CleanTest', '--width', '854', '--height', '480'" build.gradle

          ./gradlew --no-daemon compileJava

      - name: Generate test world on NeoForge ${{ matrix.neo }}
        shell: bash
        run: |
          set -euo pipefail
          cd runtime-mdk

          echo 'eula=true' > run/eula.txt
          cat > run/server.properties <<'EOF'
          level-name=world
          level-type=minecraft:flat
          online-mode=false
          difficulty=normal
          gamemode=survival
          spawn-monsters=false
          view-distance=4
          simulation-distance=4
          EOF

          setsid ./gradlew --no-daemon runServer > ../server-console-${{ matrix.neo }}.log 2>&1 &
          PID=$!
          READY=0

          for i in $(seq 1 180); do
            if grep -qE 'Done \(.*\)!|For help, type' run/logs/latest.log 2>/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          cp run/logs/latest.log ../dedicated-server-${{ matrix.neo }}.log 2>/dev/null || true
          kill -- -"$PID" 2>/dev/null || true
          sleep 2

          test "$READY" -eq 1
          test -f run/world/level.dat

          rm -rf run/saves/CleanTest
          mkdir -p run/saves/CleanTest
          cp -a run/world/. run/saves/CleanTest/

      - name: Run literal client on NeoForge ${{ matrix.neo }}
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool imagemagick libgl1-mesa-dri mesa-utils

          cd runtime-mdk

          cat > run/options.txt <<'EOF'
          version:3955
          onboardAccessibility:false
          EOF

          mkdir -p "../screenshots-${{ matrix.neo }}"
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset > "../xvfb-${{ matrix.neo }}.log" 2>&1 &
          export DISPLAY=:99
          openbox > "../openbox-${{ matrix.neo }}.log" 2>&1 &
          sleep 2

          setsid ./gradlew --no-daemon runClient > "../client-console-${{ matrix.neo }}.log" 2>&1 &
          PID=$!

          RESULT=0
          SCREENSHOT=0
          for i in $(seq 1 300); do
            if grep -q '\[CLEAN-HI\] CLIENT_VISUAL_PROGRESS' run/logs/latest.log 2>/dev/null && [ "$SCREENSHOT" -eq 0 ]; then
              import -window root "../screenshots-${{ matrix.neo }}/stasis.png" 2>/dev/null || true
              SCREENSHOT=1
            fi

            if grep -q '\[CLEAN-HI\] SERVER_CLEAN_PASS' run/logs/latest.log 2>/dev/null \
                && grep -q '\[CLEAN-HI\] CLIENT_CLEAN_PASS' run/logs/latest.log 2>/dev/null; then
              RESULT=1
              sleep 3
              break
            fi

            if grep -q '\[CLEAN-HI\] FAIL' run/logs/latest.log 2>/dev/null; then
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          import -window root "../screenshots-${{ matrix.neo }}/final.png" 2>/dev/null || true
          cp run/logs/latest.log "../client-latest-${{ matrix.neo }}.log" 2>/dev/null || true
          kill -- -"$PID" 2>/dev/null || true
          sleep 2

          test "$RESULT" -eq 1

      - name: Assert NeoForge ${{ matrix.neo }} runtime
        shell: bash
        run: |
          set -euo pipefail
          LOG="client-latest-${{ matrix.neo }}.log"

          grep -q '\[CLEAN-HI\] ATTACK_TRIGGER .*frozen=true' "$LOG"
          grep -Eq '\[CLEAN-HI\] SERVER_RESULT dealt=4.0 frozenStable=true resumeDelta=[01]' "$LOG"
          grep -q '\[CLEAN-HI\] SERVER_CLEAN_PASS' "$LOG"
          grep -Eq '\[CLEAN-HI\] CLIENT_VISUAL_PROGRESS ringFrames=[1-9][0-9]* grayscalePasses=[1-9][0-9]*' "$LOG"
          grep -Eq '\[CLEAN-HI\] CLIENT_CLEAN_PASS ringFrames=[1-9][0-9]* grayscalePasses=[1-9][0-9]* resumedTick=' "$LOG"

          ! grep -q '\[CLEAN-HI\] FAIL' "$LOG"
          ! grep -Eq 'InvalidMixinException|NoSuchMethodError|NoClassDefFoundError|ClassNotFoundException|VerifyError' "$LOG"

          grep -E '\[CLEAN-HI\]|hit_indicator|ERROR|FATAL|InvalidMixinException|NoClassDefFoundError' "$LOG" > "runtime-summary-${{ matrix.neo }}.txt" || true
          echo "NEOFORGE_${{ matrix.neo }}_RUNTIME_PASS" >> "runtime-summary-${{ matrix.neo }}.txt"

      - name: Upload NeoForge ${{ matrix.neo }} evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hit-indicator-clean-v2-neoforge-${{ matrix.neo }}-evidence
          path: |
            client-latest-${{ matrix.neo }}.log
            dedicated-server-${{ matrix.neo }}.log
            runtime-summary-${{ matrix.neo }}.txt
            screenshots-${{ matrix.neo }}/**
